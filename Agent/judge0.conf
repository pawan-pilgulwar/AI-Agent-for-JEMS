################################################################################
# cgroup v2 workaround (Docker Desktop / WSL2)
################################################################################
# Judge0 1.13.1's isolate sandbox only supports cgroup v1. With these enabled,
# Judge0 runs isolate without --cg (limits applied per process instead), so
# submissions stop failing with "Failed to create control group ... box-N".
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true
# Per-process limits cap virtual address space, and the JVM reserves far more than it uses,
# so the compile step (run with MAX_MEMORY_LIMIT) needs headroom for javac to start.
MAX_MEMORY_LIMIT=2048000

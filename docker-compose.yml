version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # First-time setup: after `docker-compose up -d`, pull the model once:
    #   docker exec -it <ollama_container_name> ollama pull llama3.2:1b

  jems-agent:
    build: .
    image: jems-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - ollama
    restart: unless-stopped
volumes:
  ollama_data:

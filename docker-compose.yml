version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Command: >
    #   bash -c "ollama serve --model qwen3:30b --port 11434"
    # First-time setup: after `docker-compose up -d`, pull the model once:
    #   docker exec -it <ollama_container_name> ollama pull qwen3:30b

  jems-agent:
    # build: .
    image: pawan0603/jems-agent:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - ollama
    restart: unless-stopped
volumes:
  ollama_data:
